name: Build iOS App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: sudo xcode-select -s /Applications/Xcode.app || true

      - name: Generate app icon
        run: python3 .github/scripts/generate_icon.py

      - name: Install XcodeGen
        run: brew install XcodeGen

      - name: Generate project
        run: xcodegen generate

      - name: Build unsigned
        run: |
          xcodebuild -project AdhkarWidget.xcodeproj \
            -scheme AdhkarWidget \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            -derivedDataPath /tmp/Build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Create IPA
        run: |
          brew install ldid
          APP="/tmp/Build/Build/Products/Debug-iphoneos/AdhkarWidget.app"
          python3 .github/scripts/write_entitlements.py
          ldid -S/tmp/entitlements.plist "$APP/AdhkarWidget" && echo "Signed OK" || echo "Sign FAIL"
          mkdir -p /tmp/Payload
          cp -R "$APP" /tmp/Payload/
          cd /tmp
          zip -r AdhkarWidget.ipa Payload
          ls -lh AdhkarWidget.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AdhkarWidget.ipa
          path: /tmp/AdhkarWidget.ipa
