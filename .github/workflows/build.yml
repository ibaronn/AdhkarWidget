name: Build iOS App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Download XcodeGen 2.32
        run: |
          curl -sL https://github.com/XcodeGen/XcodeGen/releases/download/2.32.0/xcodegen.zip -o /tmp/xcodegen.zip
          unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen
          sudo cp /tmp/xcodegen/xcodegen /usr/local/bin/

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for Simulator
        run: |
          xcodebuild -project AdhkarWidget.xcodeproj \
            -scheme AdhkarWidget \
            -destination 'platform=iOS Simulator,name=iPhone 15 Pro,OS=17.5' \
            -configuration Debug \
            build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AdhkarWidget-Simulator-Build
          path: ~/Library/Developer/Xcode/DerivedData/**/Build/Products/Debug-iphonesimulator/AdhkarWidget.app
          if-no-files-found: warn
