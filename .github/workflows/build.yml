name: Build iOS App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: sudo xcode-select -s /Applications/Xcode.app || true

      - name: Install XcodeGen
        run: brew install XcodeGen

      - name: Generate project
        run: xcodegen generate

      - name: Build for Simulator
        run: |
          xcodebuild -project AdhkarWidget.xcodeproj \
            -scheme AdhkarWidget \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=latest' \
            -configuration Debug \
            build

      - name: Find and zip build
        run: |
          find ~/Library/Developer/Xcode/DerivedData -name "AdhkarWidget.app" -path "*/Debug-iphonesimulator/*" -type d | head -1 | while read app; do
            echo "Found: $app"
            ditto -c -k --rsrc "$app" /tmp/AdhkarWidget.zip
          done
          ls -la /tmp/AdhkarWidget.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AdhkarWidget-Simulator-Build
          path: /tmp/AdhkarWidget.zip
          if-no-files-found: warn
