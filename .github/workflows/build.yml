name: Build iOS App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: sudo xcode-select -s /Applications/Xcode.app || true

      - name: Generate app icon
        run: python3 .github/scripts/generate_icon.py

      - name: Install XcodeGen
        run: brew install XcodeGen

      - name: Generate project
        run: xcodegen generate

      - name: Write entitlements
        run: python3 .github/scripts/write_entitlements.py

      - name: Build for iOS Device (unsigned)
        run: |
          xcodebuild -project AdhkarWidget.xcodeproj \
            -scheme AdhkarWidget \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            -derivedDataPath /tmp/AdhkarWidgetBuild \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Sign and create IPA
        run: |
          APP="/tmp/AdhkarWidgetBuild/Build/Products/Debug-iphoneos/AdhkarWidget.app"
          EXT="$APP/PlugIns/AdhkarWidgetExtension.appex"

          # Install ldid
          brew install ldid

          # Sign main binary
          ldid -S/tmp/entitlements.plist "$APP/AdhkarWidget" && echo "ldid OK: main" || echo "ldid FAIL: main"

          # Sign extension
          if [ -d "$EXT" ]; then
            ldid -S/tmp/entitlements.plist "$EXT/AdhkarWidgetExtension" && echo "ldid OK: ext" || echo "ldid FAIL: ext"
          fi

          # Package as IPA
          mkdir -p /tmp/Payload
          cp -R "$APP" /tmp/Payload/
          cd /tmp
          zip -r AdhkarWidget.ipa Payload -x "*.DS_Store"
          ls -lh /tmp/AdhkarWidget.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AdhkarWidget.ipa
          path: /tmp/AdhkarWidget.ipa
