name: Build iOS App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install XcodeGen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for Simulator (no signing needed)
        run: |
          xcodebuild -project AdhkarWidget.xcodeproj \
            -scheme AdhkarWidget \
            -destination 'platform=iOS Simulator,name=iPhone 15 Pro,OS=17.0' \
            -configuration Debug \
            build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AdhkarWidget-Simulator-Build
          path: ~/Library/Developer/Xcode/DerivedData/**/Build/Products/Debug-iphonesimulator/AdhkarWidget.app
          if-no-files-found: warn

  build-ipa:
    runs-on: macos-14
    needs: build
    if: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install XcodeGen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Install Fastlane
        run: brew install fastlane

      - name: Build and sign IPA
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          fastlane run build_app \
            scheme: "AdhkarWidget" \
            export_method: "development"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AdhkarWidget.ipa
          path: AdhkarWidget.ipa
