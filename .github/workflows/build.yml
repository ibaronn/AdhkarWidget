name: Build iOS App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: sudo xcode-select -s /Applications/Xcode.app || true

      - name: Install XcodeGen
        run: brew install XcodeGen

      - name: Generate project
        run: xcodegen generate

      - name: Build for Simulator
        run: |
          xcodebuild -project AdhkarWidget.xcodeproj \
            -scheme AdhkarWidget \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=latest' \
            -configuration Debug \
            build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AdhkarWidget-Simulator-Build
          path: ~/Library/Developer/Xcode/DerivedData/**/Build/Products/Debug-iphonesimulator/AdhkarWidget.app
          if-no-files-found: warn
