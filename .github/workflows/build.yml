name: Build iOS App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: sudo xcode-select -s /Applications/Xcode.app || true

      - name: Install XcodeGen
        run: brew install XcodeGen

      - name: Generate project
        run: xcodegen generate

      - name: Build for iOS Device (unsigned IPA)
        run: |
          xcodebuild -project AdhkarWidget.xcodeproj \
            -scheme AdhkarWidget \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            -derivedDataPath /tmp/AdhkarWidgetBuild \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Create unsigned IPA
        run: |
          mkdir -p /tmp/Payload
          cp -R /tmp/AdhkarWidgetBuild/Build/Products/Debug-iphoneos/AdhkarWidget.app /tmp/Payload/
          cd /tmp
          zip -r AdhkarWidget.ipa Payload -x "*.DS_Store"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AdhkarWidget.ipa
          path: /tmp/AdhkarWidget.ipa
