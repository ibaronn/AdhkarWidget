name: AdhkarWidget
options:
  bundleIdPrefix: com.adhkar
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  developmentLanguage: ar

settings:
  SWIFT_VERSION: "5.9"

targets:
  AdhkarWidget:
    type: application
    platform: iOS
    sources:
      - path: AdhkarWidget
        includes:
          - "*.swift"
          - "Models/*.swift"
        excludes:
          - "Widget/*"
      - path: AdhkarWidget/Info.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.adhkar.widgetapp
      INFOPLIST_FILE: AdhkarWidget/Info.plist
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) APP"
    dependencies:
      - target: AdhkarWidgetExtension

  AdhkarWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: AdhkarWidget
        includes:
          - "Widget/*.swift"
          - "Models/*.swift"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.adhkar.widgetapp.extension
      INFOPLIST_FILE: AdhkarWidgetExtension/Info.plist
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) EXTENSION"
    info:
      path: AdhkarWidgetExtension/Info.plist
