name: AdhkarWidget
options:
  bundleIdPrefix: com.adhkar
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  developmentLanguage: ar

settings:
  SWIFT_VERSION: "5.9"

targets:
  AdhkarWidget:
    type: application
    platform: iOS
    sources:
      - path: AdhkarWidget
        includes:
          - "*.swift"
          - "Models/*.swift"
          - "Resources/*"
        excludes:
          - "Widget/*"
      - path: AdhkarWidget/Info.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.adhkar.widgetapp
      INFOPLIST_FILE: AdhkarWidget/Info.plist
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
